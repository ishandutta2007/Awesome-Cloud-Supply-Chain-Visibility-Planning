<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glowing Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>

    <!-- Animated Pulse effect -->
    <style>
      .pulse-line {
        stroke-dasharray: 10, 15;
        animation: dash 20s linear infinite;
      }
      .node-pulse {
        animation: float 4s ease-in-out infinite alternate;
      }
      .node-pulse-2 {
        animation: float 5s ease-in-out infinite alternate-reverse;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="350" fill="url(#grid)" rx="16" />

  <!-- Dynamic / Animated Background Supply Chain Network Flows -->
  <g stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" fill="none" class="pulse-line">
    <path d="M 100 280 Q 300 320 500 270 T 900 290 T 1100 250" />
    <path d="M 50 80 Q 250 40 450 90 T 850 60 T 1150 100" />
    <path d="M 150 300 C 350 200 800 340 1050 280" />
  </g>

  <!-- Background Nodes / Elements -->
  <g class="node-pulse">
    <circle cx="150" cy="280" r="6" fill="#38bdf8" opacity="0.6" />
    <circle cx="500" cy="270" r="8" fill="#818cf8" opacity="0.6" />
    <circle cx="900" cy="290" r="5" fill="#34d399" opacity="0.6" />
    <circle cx="1050" cy="280" r="7" fill="#fbbf24" opacity="0.6" />
  </g>

  <g class="node-pulse-2">
    <circle cx="250" cy="40" r="7" fill="#38bdf8" opacity="0.5" />
    <circle cx="450" cy="90" r="5" fill="#f472b6" opacity="0.5" />
    <circle cx="850" cy="60" r="8" fill="#38bdf8" opacity="0.5" />
  </g>

  <!-- FOREGROUND CONTENT (Guaranteed high visibility and contrast) -->

  <!-- Top Category Pill -->
  <g transform="translate(435, 35)">
    <rect width="330" height="32" rx="16" fill="url(#pillGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="165" y="21" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">
      🚚 CLOUD SUPPLY CHAIN &amp; PLANNING
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="135" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5" text-anchor="middle" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.6))">
    Awesome Cloud Supply Chain Visibility &amp; Planning
  </text>

  <!-- Subtitle -->
  <text x="600" y="180" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="500" text-anchor="middle" filter="drop-shadow(0px 2px 6px rgba(0,0,0,0.8))">
    Curated SaaS Platforms, End-to-End Visibility, Open-Source Engines &amp; N-Tier Traceability
  </text>

  <!-- Feature Badges Row -->
  <g transform="translate(240, 225)">
    <!-- Badge 1: SaaS & Cloud -->
    <rect x="0" y="0" width="220" height="42" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="110" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
      ☁️ SaaS &amp; Hyperscalers
    </text>

    <!-- Badge 2: Open Source -->
    <rect x="250" y="0" width="220" height="42" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="#34d399" stroke-width="1.5"/>
    <text x="360" y="26" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
      🔓 Open-Source Engines
    </text>

    <!-- Badge 3: Traceability -->
    <rect x="500" y="0" width="220" height="42" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="610" y="26" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
      🔗 N-Tier Traceability
    </text>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="0" y="344" width="1200" height="6" fill="#38bdf8" />
</svg>
